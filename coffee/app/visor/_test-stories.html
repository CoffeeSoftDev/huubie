<script>
const RESPUESTA = `Historias del módulo **Admin de documentos**:

\`\`\`stories
proyecto: Admin de documentos
historias:
  - banner: Admin de documentos
  - usuario: ADMIN
    apartado: EXPLORADOR DE PROYECTOS
    quiero: Visualizar los documentos de un proyecto en un árbol de carpetas, pudiendo buscar por nombre de proyecto y por nombre de documento.
    beneficio: Para localizar rápido el documento que se necesita sin recorrer el disco del servidor.
    criterios:
      intro: El apartado debe contener los siguientes elementos
      bloques:
        - tipo: filterBar
          items:
            - Buscador de proyecto ( placeholder "Buscar proyecto..." )
            - Buscador de documento por nombre
            - Botón de nueva carpeta
            - Botón de subir archivo ( primary )
        - tipo: cards
          titulo: Árbol de carpetas del proyecto
          items:
            - Nombre de carpeta con contador de documentos
            - Al seleccionar una carpeta se listan sus documentos
        - tipo: tabla
          titulo: Listado de documentos
          items:
            - Nombre del documento
            - Extensión ( badge )
            - Tamaño
            - Última modificación
            - item: Botones de acción
              sub: [ ver, renombrar, eliminar ]
      reglas:
        - nivel: nota
          texto: Mientras no se elija proyecto se muestra el estado vacío "Selecciona un proyecto"
        - nivel: nota
          texto: Solo se listan las rutas dentro de la raíz configurada del proyecto
  - usuario: ADMIN
    apartado: EDITOR DE DOCUMENTO
    quiero: Abrir un documento markdown, editarlo y guardarlo sin salir del visor.
    beneficio: Para corregir la documentación en el momento en que se detecta el error.
    criterios:
      intro: Al precionar el botón de ver se abre el documento con lo siguiente
      bloques:
        - tipo: header
          items:
            - Ruta del documento
            - Fecha de última modificación
            - Tabs [ Vista, Código ]
        - tipo: modal
          titulo: Body
          items:
            - "Vista: el markdown renderizado"
            - "Código: el texto plano editable"
        - tipo: footer
          items:
            - Botón cancelar
            - Botón guardar
      reglas:
        - nivel: nota
          texto: El botón de guardar solo se habilita si hubo cambios
        - nivel: importante
          texto: "Guardar sobreescribe el archivo en disco: se pide confirmación cuando el documento cambió desde que se abrió"
  - usuario: DEVELOPER
    apartado: BASE DE DATOS
    quiero: Realizar un diagrama Entidad-Relación de los documentos y sus permisos.
    beneficio: Para visualizar las dependencias entre tablas antes de construir la pantalla.
    criterios:
      bloques:
        - tipo: nota
          titulo: Entregable
          items:
            - Crear diagrama en excalidraw
            - Seguir la nomenclatura de colores y diseños
\`\`\`

Supuestos: el módulo tiene un solo perfil operativo (ADMIN).`;

const ERS = `Levanté el ERS leyendo la carpeta del proyecto:

\`\`\`ers
sistema:  Sistema de Facturación
resumen:  Control de tickets y de los medios de pago asociados a cada transacción.
fecha:    "2026-08-06"
proyecto: CoffeeSoft / Facturacion
descripcion: |
  Es un sistema que se encarga del control de tickets y sus diferentes medios de pago
  asociados a cada transacción. Su objetivo principal es generar un concentrado ordenado
  de tickets, diferenciando entre facturados y no facturados.
objetivo: |
  Permitir controlar un monto correcto de venta aplicando cálculo de porcentaje, donde el
  70% es la meta de venta facturada y el 30% restante no lo es.
modulos:
  - nombre: Módulo de carga de tickets del POS
    pestana: Pestaña detallado
    descripcion: Sube los tickets seleccionando mes y año; las columnas sin dato quedan en null.
    campos:
      - Día
      - Fecha de operación
      - Hora de cierre
      - Semana
      - Movimiento PDV
      - Orden
      - Tipo de orden
      - No. Mesa
      - Mesero
      - Terminal
      - Subtotal
      - Iva
      - IEPS
      - Total
      - Descuento
  - nombre: Módulo de ventas por forma de pago
    pestana: Pestaña pagos
    descripcion: Carga el detalle de cobros del día con su referencia bancaria.
    campos:
      - Cajero
      - Forma de pago
      - Fecha de pago
      - Referencia
      - Transacción
      - Total cobrado
  - nombre: Módulo de consulta
    campos:
      - Acumulado total real
      - No facturados que se van a facturar
      - Orden facturado
usuarios:
  - ADMINISTRADOR DEL POS
exito:
  - titulo: Consultar tickets por fecha
    texto: Selecciona un día y ve todos los tickets ordenados, distinguiendo los facturados de los pendientes.
  - titulo: Calcular el porcentaje al 16%
    texto: "De $31,843.90 del día 10: a facturar $19,312.43, ya facturado $2,978.30."
fases:
  - nombre: FASE 1 · ANÁLISIS
    items:
      - Crear la base de datos con los campos requeridos y su diagrama ER
      - Definir las tablas principales que no se modificarán
  - nombre: FASE 2 · ADMINISTRADOR
    items:
      - Módulo para subir el archivo de ventas diarias por mes
      - Módulo de administración de métodos de pago
excepciones:
  - "El sistema no timbra facturas: solo concentra y marca los tickets facturados"
observaciones:
  - Las notas del día llevan consecutivo y se reinician al día siguiente
  - Del total de tickets del día no se muestran los pagados en efectivo
archivos:
  - ruta: ctrl/ctrl-facturacion.php
    lineas: 412
    aporte: Operaciones del módulo
  - ruta: src/js/facturacion.js
    lineas: 1204
    aporte: Pestañas, columnas y modales
\`\`\`

Supuestos: los campos salieron del Excel de ventas que ya usa el POS.`;

['msgA', 'msgB'].forEach(function (id) {
    const $m = $('#' + id);
    $m.html(IARender.markdownToHtml(RESPUESTA));
    IARender.postProcess($m);
});
['msgC', 'msgD'].forEach(function (id) {
    const $m = $('#' + id);
    if (!$m.length) return;
    $m.html(IARender.markdownToHtml(ERS));
    IARender.postProcess($m);
});
lucide.createIcons();
</script>
