<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Plan de Compra - Compras Planificadas</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            blue: {
                                50:'#FBF3EF',100:'#F7E3DC',200:'#EFC9BC',300:'#E8A68F',400:'#D9826A',
                                500:'#C8694C',600:'#C05A40',700:'#A84A33',800:'#8F3D2A',900:'#6E2F20',950:'#4A1F16'
                            }
                        },
                        fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
                    }
                }
            };
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family:'Inter',system-ui,sans-serif; background:rgba(17,24,40,.45); }
        .lbl { display:block; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:#6b7280; margin-bottom:4px; }
        .inp { width:100%; padding:7px 10px; font-size:12px; color:#1f2937; background:#fff; border:1px solid #d1d5db; border-radius:6px; outline:none; }
        .inp:focus { border-color:#C8694C; }
        .tipo-card { border:2px solid #e5e7eb; border-radius:10px; padding:12px; cursor:pointer; text-align:left; transition:.15s; }
        .tipo-card.on-semanal { border-color:#6366f1; background:#eef2ff; }
        .tipo-card.on-evento  { border-color:#ec4899; background:#fdf2f8; }
        .day { width:34px; height:30px; border-radius:6px; font-size:11px; font-weight:600; border:1px solid #e5e7eb; color:#4b5563; }
        .day.on { background:#C05A40; border-color:#C05A40; color:#fff; }
        .toggle { width:34px; height:18px; border-radius:999px; background:#d1d5db; position:relative; flex-shrink:0; }
        .toggle::after { content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:.15s; }
        .toggle.on { background:#C05A40; }
        .toggle.on::after { left:18px; }
    </style>
</head>

<!-- ============================================================
     NUEVO PLAN DE COMPRA (comprador)
       Semanal -> recurrencia (dia de corte / dia de entrega), se
                  autogenera cada semana; sugeridos por consumo.
       Evento  -> fecha unica, invitados/porciones (escala recetas),
                  presupuesto propio y areas que deben solicitar.
============================================================ -->
<body class="min-h-screen flex items-center justify-center p-4 text-gray-800">

<div class="w-full max-w-2xl bg-white rounded-xl shadow-2xl border border-gray-200 flex flex-col max-h-[94vh] overflow-hidden">

    <div class="px-5 py-3.5 bg-gray-50 border-b border-gray-200 flex items-center justify-between flex-shrink-0">
        <div class="flex items-center gap-2.5">
            <span class="w-8 h-8 rounded-lg bg-blue-600/10 flex items-center justify-center"><i data-lucide="calendar-plus" class="w-4 h-4 text-blue-700"></i></span>
            <div>
                <h2 class="text-sm font-bold text-gray-800">Nuevo plan de compra</h2>
                <p class="text-[11px] text-gray-500">Abre una ventana para que las areas soliciten con anticipacion</p>
            </div>
        </div>
        <button onclick="window.close()" class="w-7 h-7 rounded-lg bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-500"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>

    <div class="overflow-y-auto px-5 py-4 flex-1 space-y-5">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <button class="tipo-card on-semanal" data-tipo="semanal">
                <div class="flex items-center gap-2.5">
                    <span class="w-9 h-9 rounded-lg bg-indigo-500/15 flex items-center justify-center"><i data-lucide="repeat" class="w-5 h-5 text-indigo-700"></i></span>
                    <div><p class="text-sm font-bold text-gray-800">Semanal</p><p class="text-[11px] text-gray-500">Abasto recurrente de cada semana</p></div>
                </div>
            </button>
            <button class="tipo-card" data-tipo="evento">
                <div class="flex items-center gap-2.5">
                    <span class="w-9 h-9 rounded-lg bg-pink-500/15 flex items-center justify-center"><i data-lucide="party-popper" class="w-5 h-5 text-pink-700"></i></span>
                    <div><p class="text-sm font-bold text-gray-800">Evento especial</p><p class="text-[11px] text-gray-500">Boda, banquete, temporada, pedido grande</p></div>
                </div>
            </button>
        </div>

        <!-- SEMANAL -->
        <div id="f-semanal" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div><label class="lbl">Nombre</label><input class="inp" value="Semana 42 · 19 al 25 oct"></div>
                <div><label class="lbl">Sucursales</label><select class="inp"><option>Todas las sucursales</option><option>Sucursal Centro</option><option>Sucursal Norte</option></select></div>
            </div>
            <div>
                <label class="lbl">Dia de corte de solicitudes</label>
                <div class="flex items-center gap-1.5 flex-wrap">
                    <button class="day">L</button><button class="day">M</button><button class="day">M</button><button class="day on">J</button><button class="day">V</button><button class="day">S</button><button class="day">D</button>
                    <input type="time" class="inp w-28 ml-2" value="18:00">
                </div>
            </div>
            <div>
                <label class="lbl">Dia de entrega en almacen</label>
                <div class="flex items-center gap-1.5 flex-wrap">
                    <button class="day on">L</button><button class="day">M</button><button class="day">M</button><button class="day">J</button><button class="day">V</button><button class="day">S</button><button class="day">D</button>
                    <span class="text-[11px] text-gray-500 ml-2">de la semana siguiente</span>
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div><label class="lbl">Presupuesto semanal</label><input class="inp" value="$15,000.00"></div>
                <div><label class="lbl">Repetir</label><select class="inp"><option>Cada semana, sin fecha fin</option><option>Durante 4 semanas</option><option>Solo esta semana</option></select></div>
            </div>
            <label class="flex items-start gap-2.5 text-xs cursor-pointer">
                <span class="toggle on mt-0.5"></span>
                <span><b class="text-gray-700">Precargar sugeridos</b><br><span class="text-[11px] text-gray-500">Cada area recibe su lista sugerida segun el consumo promedio de las ultimas 4 semanas, menos su stock.</span></span>
            </label>
        </div>

        <!-- EVENTO -->
        <div id="f-evento" class="hidden space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div><label class="lbl">Nombre del evento</label><input class="inp" value="Boda Hernandez-Lopez"></div>
                <div><label class="lbl">Cliente / referencia</label><input class="inp" placeholder="Pedido o contrato" value="PED-2026-0412"></div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div><label class="lbl">Fecha del evento</label><input type="date" class="inp" value="2026-10-17"></div>
                <div><label class="lbl">Entrega de insumos</label><input type="date" class="inp" value="2026-10-16"></div>
                <div><label class="lbl">Corte de solicitudes</label><input type="date" class="inp" value="2026-10-13"></div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div><label class="lbl">Invitados / porciones</label><input type="number" class="inp" value="350"></div>
                <div><label class="lbl">Sucursal</label><select class="inp"><option>Sucursal Centro</option><option>Sucursal Norte</option></select></div>
                <div><label class="lbl">Presupuesto</label><input class="inp" value="$28,000.00"></div>
            </div>
            <div>
                <label class="lbl">Areas que deben solicitar</label>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
                    <label class="flex items-center gap-2 border border-gray-200 rounded-md px-2.5 py-2"><input type="checkbox" checked class="accent-[#C05A40]"><i data-lucide="chef-hat" class="w-3.5 h-3.5 text-emerald-600"></i> Cocina caliente</label>
                    <label class="flex items-center gap-2 border border-gray-200 rounded-md px-2.5 py-2"><input type="checkbox" checked class="accent-[#C05A40]"><i data-lucide="chef-hat" class="w-3.5 h-3.5 text-emerald-600"></i> Reposteria</label>
                    <label class="flex items-center gap-2 border border-gray-200 rounded-md px-2.5 py-2"><input type="checkbox" class="accent-[#C05A40]"><i data-lucide="chef-hat" class="w-3.5 h-3.5 text-emerald-600"></i> Panaderia</label>
                    <label class="flex items-center gap-2 border border-gray-200 rounded-md px-2.5 py-2"><input type="checkbox" checked class="accent-[#C05A40]"><i data-lucide="store" class="w-3.5 h-3.5 text-sky-600"></i> Salon / montaje</label>
                    <label class="flex items-center gap-2 border border-gray-200 rounded-md px-2.5 py-2"><input type="checkbox" checked class="accent-[#C05A40]"><i data-lucide="store" class="w-3.5 h-3.5 text-sky-600"></i> Limpieza</label>
                </div>
            </div>
            <div>
                <label class="lbl">Menu del evento (opcional)</label>
                <div class="border border-gray-200 rounded-lg divide-y divide-gray-100 text-xs">
                    <div class="flex items-center justify-between px-3 py-2"><span class="font-medium text-gray-700">Lomo en salsa de ciruela</span><span class="text-gray-500">350 porc.</span></div>
                    <div class="flex items-center justify-between px-3 py-2"><span class="font-medium text-gray-700">Arroz a la mexicana</span><span class="text-gray-500">350 porc.</span></div>
                    <div class="flex items-center justify-between px-3 py-2"><span class="font-medium text-gray-700">Pastel de tres leches 3 pisos</span><span class="text-gray-500">1 pza</span></div>
                    <div class="px-3 py-2"><button class="text-[11px] font-semibold text-blue-700 flex items-center gap-1"><i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> Agregar platillo</button></div>
                </div>
                <p class="text-[11px] text-gray-500 mt-1.5 flex items-center gap-1"><i data-lucide="info" class="w-3 h-3"></i> Si cargas el menu, produccion recibe los ingredientes ya escalados a 350 porciones.</p>
            </div>
        </div>

        <label class="flex items-start gap-2.5 text-xs cursor-pointer">
            <span class="toggle on mt-0.5"></span>
            <span><b class="text-gray-700">Avisar a los responsables</b><br><span class="text-[11px] text-gray-500">Notificacion al abrir el plan y recordatorio 24 h antes del corte a quien no haya solicitado.</span></span>
        </label>
    </div>

    <div class="px-5 py-3 border-t border-gray-200 bg-gray-50 flex items-center justify-end gap-2 flex-shrink-0">
        <button onclick="window.close()" class="px-3.5 py-2 text-xs font-semibold text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">Cancelar</button>
        <button class="px-3.5 py-2 text-xs font-bold text-white bg-blue-600 rounded-md hover:bg-blue-700 flex items-center gap-1.5"><i data-lucide="calendar-check" class="w-3.5 h-3.5"></i> Abrir plan</button>
    </div>
</div>

<script>
    document.querySelectorAll('.tipo-card').forEach(card => card.onclick = () => {
        const tipo = card.dataset.tipo;
        document.querySelectorAll('.tipo-card').forEach(c => c.classList.remove('on-semanal', 'on-evento'));
        card.classList.add('on-' + tipo);
        document.getElementById('f-semanal').classList.toggle('hidden', tipo !== 'semanal');
        document.getElementById('f-evento').classList.toggle('hidden', tipo !== 'evento');
    });
    document.querySelectorAll('.day').forEach(d => d.onclick = () => {
        d.parentElement.querySelectorAll('.day').forEach(x => x.classList.remove('on'));
        d.classList.add('on');
    });
    document.querySelectorAll('.toggle').forEach(t => t.parentElement.onclick = () => t.classList.toggle('on'));
    lucide.createIcons();
</script>
</body>
</html>
