<!DOCTYPE html>
<!--
    Propuesta E :: iPhone
    Hoja de vidrio al estilo iOS sobre el mismo recurso de fondo del login actual
    (la franja de color desenfocada al pie, más una mancha arriba) en tonos nuevos.
    Ícono de app, título grande, campos agrupados como en Ajustes, interruptor
    iOS y botón con el color del tono. Con clave incorrecta el grupo tiembla.

    Tonos: --t1..--t4 pintan el halo y --accent botón, enlaces y foco. El selector
    de arriba a la derecha es solo para elegir tono en la maqueta.

    Contrato con acceso/src/js/index.js (no renombrar):
      #form_login, #usuario, #clave, #btnEye, #rememberMe, #login-error,
      #login-error-text, #emailField, #rememberedUser, #rememberedAvatar,
      #rememberedName, #rememberedEmail, #forgetUserBtn
-->
<html lang="es" data-tone="aurora">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../../src/img/logos/coffee_icon.png" type="image/x-icon">
    <title>Coffee Inventory - Propuesta E</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #F2F2F7;
            --ink:       #1C1C1E;
            --ink-soft:  #6C6C70;
            --ink-mute:  #AEAEB2;
            --row:       #FFFFFF;
            --sep:       rgba(60, 60, 67, 0.16);
            --sheet:     rgba(255, 255, 255, 0.66);
            --danger:    #FF3B30;
            --ok:        #34C759;
        }

        /* -- Tonos -- */
        :root[data-tone="aurora"]    { --t1: #BDF2DF; --t2: #B3E2F8; --t3: #C7C5F8; --t4: #EAC7F3; --accent: #4F46E5; }
        :root[data-tone="atardecer"] { --t1: #FFC3A8; --t2: #FFA9C6; --t3: #D2AEFF; --t4: #A9C6FF; --accent: #E0457B; }
        :root[data-tone="citrico"]   { --t1: #FBEB9E; --t2: #D9F2A2; --t3: #A9EAC9; --t4: #A2DDF0; --accent: #0F9F6E; }
        :root[data-tone="champan"]   { --t1: #F6E3C6; --t2: #F3CBC6; --t3: #E5D0EA; --t4: #D3DDF1; --accent: #8B5E3C; }
        :root[data-tone="terracota"] { --t1: #F5DED2; --t2: #EBBBA4; --t3: #E3A68D; --t4: #F1E2D6; --accent: #C05A40; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        /* Mismo halo del login actual (franja al pie, desenfocada y desvanecida
           hacia arriba), con los tonos nuevos y más presencia. */
        body::after {
            content: '';
            position: fixed;
            left: -10%;
            right: -10%;
            bottom: -40px;
            height: 340px;
            z-index: 0;
            pointer-events: none;
            background: linear-gradient(100deg, var(--t1) 0%, var(--t2) 32%, var(--t3) 64%, var(--t4) 100%);
            filter: blur(60px);
            opacity: .95;
            -webkit-mask-image: linear-gradient(to top, #000 45%, transparent 100%);
            mask-image: linear-gradient(to top, #000 45%, transparent 100%);
            transition: background .6s;
        }

        body::before {
            content: '';
            position: fixed;
            width: 520px;
            height: 520px;
            top: -260px;
            right: -160px;
            z-index: 0;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, var(--t3) 0%, transparent 65%);
            opacity: .8;
            transition: background .6s;
        }

        .logo {
            display: block;
            background: currentColor;
            -webkit-mask: url('../../../src/img/logos/coffeesoft-logo-64.svg') center / contain no-repeat;
            mask: url('../../../src/img/logos/coffeesoft-logo-64.svg') center / contain no-repeat;
        }

        /* -- Selector de tono (maqueta) -- */
        .tones {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.8);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            backdrop-filter: saturate(180%) blur(20px);
            box-shadow: 0 6px 20px -10px rgba(0, 0, 0, 0.25);
        }

        .tone {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.12);
            cursor: pointer;
            transition: transform .15s;
        }

        .tone:hover { transform: scale(1.12); }
        .tone.on { box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 3.5px var(--accent); }

        /* -- Hoja -- */
        .sheet {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 32px 22px 24px;
            border-radius: 30px;
            background: var(--sheet);
            border: 1px solid rgba(255, 255, 255, 0.85);
            -webkit-backdrop-filter: saturate(180%) blur(30px);
            backdrop-filter: saturate(180%) blur(30px);
            box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.25), 0 1px 0 rgba(255, 255, 255, 0.9) inset;
        }

        .app-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            border-radius: 18px;
            background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 70%, #FFFFFF) 0%, var(--accent) 100%);
            color: #FFFFFF;
            box-shadow: 0 12px 24px -12px color-mix(in srgb, var(--accent) 70%, transparent), 0 1px 0 rgba(255, 255, 255, 0.45) inset;
            transition: background .6s;
        }

        .app-icon .logo { width: 40px; height: 31px; }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .subtitle {
            text-align: center;
            margin-top: 4px;
            font-size: 15px;
            color: var(--ink-soft);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 24px;
        }

        /* -- Grupo de filas (estilo Ajustes) -- */
        .group {
            border-radius: 14px;
            background: var(--row);
            overflow: hidden;
        }

        .row {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 52px;
            padding: 0 14px;
        }

        .row[hidden] { display: none; }

        /* Separador con sangría, como iOS; solo entre filas visibles. */
        .row:not([hidden]) ~ .row::before {
            content: '';
            position: absolute;
            top: 0;
            left: 46px;
            right: 0;
            height: 1px;
            background: var(--sep);
            transform: scaleY(.6);
        }

        .row > svg {
            width: 19px;
            height: 19px;
            flex-shrink: 0;
            color: var(--ink-mute);
            transition: color .15s;
        }

        .row:focus-within > svg { color: var(--accent); }

        .row-input {
            flex: 1;
            min-width: 0;
            height: 52px;
            font-family: inherit;
            font-size: 16px;
            color: var(--ink);
            background: transparent;
            border: none;
            outline: none;
            caret-color: var(--accent);
        }

        .row-input::placeholder { color: var(--ink-mute); }

        .eye-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            margin-right: -6px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--ink-mute);
            cursor: pointer;
        }

        .eye-btn:hover { color: var(--ink); }
        .eye-btn svg { width: 18px; height: 18px; }

        .group:has(.is-invalid) { animation: shake .42s cubic-bezier(.36, .07, .19, .97); }

        @keyframes shake {
            10%, 90% { transform: translateX(-2px); }
            20%, 80% { transform: translateX(4px); }
            30%, 50%, 70% { transform: translateX(-8px); }
            40%, 60% { transform: translateX(8px); }
        }

        /* -- Usuario recordado -- */
        .remembered {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
        }

        .remembered[hidden] { display: none; }

        /* Sin usuario recordado el grupo entero desaparece (index.js solo oculta la fila). */
        .group:has(> .remembered[hidden]) { display: none; }

        .remembered-avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #8E8E93;
            color: #FFFFFF;
        }

        .remembered-avatar svg { width: 21px; height: 21px; }
        .remembered-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .remembered-info { flex: 1; min-width: 0; }

        .remembered-name,
        .remembered-email {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .remembered-name { font-size: 16px; font-weight: 600; }
        .remembered-email { font-size: 13.5px; color: var(--ink-soft); }

        .link-btn {
            flex-shrink: 0;
            border: none;
            background: none;
            font-family: inherit;
            font-size: 15px;
            color: var(--accent);
            cursor: pointer;
        }

        .link-btn:hover { opacity: .75; }

        /* -- Interruptor iOS -- */
        .switch-row {
            justify-content: space-between;
            font-size: 16px;
            cursor: pointer;
            user-select: none;
        }

        .switch-row input { position: absolute; opacity: 0; pointer-events: none; }

        .switch {
            position: relative;
            width: 51px;
            height: 31px;
            flex-shrink: 0;
            border-radius: 999px;
            background: #E9E9EA;
            transition: background .2s;
        }

        .switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 27px;
            height: 27px;
            border-radius: 50%;
            background: #FFFFFF;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16);
            transition: transform .2s;
        }

        .switch-row input:checked + .switch { background: var(--ok); }
        .switch-row input:checked + .switch::after { transform: translateX(20px); }
        .switch-row input:focus-visible + .switch { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }

        /* -- Avisos -- */
        .login-error {
            display: none;
            align-items: center;
            gap: 7px;
            padding: 0 4px;
            font-size: 13.5px;
            color: var(--danger);
        }

        .login-error.show { display: flex; }
        .login-error svg { width: 16px; height: 16px; flex-shrink: 0; }

        .caps {
            display: none;
            padding: 0 4px;
            font-size: 13px;
            color: var(--ink-soft);
        }

        .caps.show { display: block; }

        /* -- Botón -- */
        .btn-continue {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 52px;
            margin-top: 4px;
            font-family: inherit;
            font-size: 17px;
            font-weight: 600;
            color: #FFFFFF;
            background: var(--accent);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: filter .15s, transform .1s, background .6s;
        }

        .btn-continue:hover { filter: brightness(1.06); }
        .btn-continue:active { transform: scale(.985); filter: brightness(.95); }
        .btn-continue svg { width: 19px; height: 19px; }
        .btn-continue .spin { display: none; }
        .btn-continue.loading { pointer-events: none; opacity: .85; }
        .btn-continue.loading .spin { display: block; animation: spin .8s linear infinite; }
        .btn-continue.loading .label { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .forgot {
            display: block;
            margin-top: 16px;
            text-align: center;
            font-size: 15px;
            color: var(--accent);
            text-decoration: none;
        }

        .forgot:hover { opacity: .75; }

        .footer {
            position: relative;
            z-index: 1;
            margin-top: 22px;
            font-size: 12px;
            color: var(--ink-soft);
        }

        .footer b { color: var(--ink); }

        @media (max-width: 480px) {
            body { padding: 64px 12px 20px; justify-content: flex-start; }
            .sheet { padding: 28px 16px 20px; border-radius: 26px; }
            .title { font-size: 26px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>

<body>

    <div class="tones" id="tones" aria-label="Tono del fondo (maqueta)"></div>

    <main class="sheet">

        <span class="app-icon" aria-hidden="true"><span class="logo"></span></span>

        <h1 class="title">Iniciar sesión</h1>
        <p class="subtitle">Usa tu cuenta de Coffee Inventory</p>

        <form id="form_login" novalidate class="login-form">

            <div class="group">
                <div id="rememberedUser" class="remembered" hidden>
                    <span id="rememberedAvatar" class="remembered-avatar"><i data-lucide="user"></i></span>
                    <span class="remembered-info">
                        <span id="rememberedName" class="remembered-name"></span>
                        <span id="rememberedEmail" class="remembered-email"></span>
                    </span>
                    <button type="button" id="forgetUserBtn" class="link-btn">Cambiar</button>
                </div>
            </div>

            <div class="group">
                <div class="row" id="emailField">
                    <i data-lucide="mail"></i>
                    <input type="email" class="row-input" name="usuario" id="usuario" placeholder="Correo electrónico" required autocomplete="username">
                </div>
                <div class="row">
                    <i data-lucide="lock"></i>
                    <input type="password" class="row-input" name="clave" id="clave" placeholder="Contraseña" required autocomplete="current-password">
                    <button type="button" class="eye-btn" id="btnEye" aria-label="Mostrar contraseña"><i data-lucide="eye"></i></button>
                </div>
            </div>

            <div id="login-error" class="login-error" role="alert">
                <i data-lucide="circle-alert"></i>
                <span id="login-error-text">Usuario y/o clave incorrectos.</span>
            </div>

            <span class="caps" id="capsHint">Bloq Mayús está activado</span>

            <div class="group">
                <label class="row switch-row">
                    <span>Recordar mi usuario</span>
                    <input type="checkbox" id="rememberMe" checked>
                    <span class="switch"></span>
                </label>
            </div>

            <button type="submit" class="btn-continue" id="btnLogin">
                <span class="label">Continuar</span>
                <i data-lucide="loader-circle" class="spin"></i>
            </button>
        </form>

        <a class="forgot" href="../../../recuperar.php">¿Olvidaste tu contraseña?</a>
    </main>

    <p class="footer">Powered by <b>CoffeeSoft</b> &copy; <span class="js-year">2026</span></p>

    <script src="../../../src/plugin/lucide/lucide.min.js"></script>
    <script>
        // Demo de la maqueta: el envío y el usuario recordado los maneja acceso/src/js/index.js.
        const $ = id => document.getElementById(id);
        const root = document.documentElement;

        const TONES = [
            { key: 'aurora',    name: 'Aurora',    a: '#BDF2DF', b: '#C7C5F8' },
            { key: 'atardecer', name: 'Atardecer', a: '#FFA9C6', b: '#A9C6FF' },
            { key: 'citrico',   name: 'Cítrico',   a: '#FBEB9E', b: '#A9EAC9' },
            { key: 'champan',   name: 'Champán',   a: '#F6E3C6', b: '#E5D0EA' },
            { key: 'terracota', name: 'Terracota', a: '#F5DED2', b: '#E3A68D' }
        ];

        function setTone(key) {
            root.setAttribute('data-tone', key);
            document.querySelectorAll('.tone').forEach(t => t.classList.toggle('on', t.dataset.tone === key));
        }

        $('tones').innerHTML = TONES.map(t =>
            `<button type="button" class="tone" data-tone="${t.key}" title="${t.name}" style="background:linear-gradient(135deg, ${t.a}, ${t.b})"></button>`
        ).join('');

        $('tones').addEventListener('click', e => {
            const t = e.target.closest('.tone');
            if (t) setTone(t.dataset.tone);
        });

        setTone(new URLSearchParams(location.search).get('tono') || 'aurora');

        // Usuario recordado de ejemplo (?recordado=1): lo que haría applyRemembered().
        if (new URLSearchParams(location.search).get('recordado') === '1') {
            $('usuario').value = 'maria@cafecentral.mx';
            $('emailField').hidden = true;
            $('rememberedAvatar').style.background = 'var(--accent)';
            $('rememberedName').textContent = 'María López';
            $('rememberedEmail').textContent = 'maria@cafecentral.mx';
            $('rememberedUser').hidden = false;
        }

        $('forgetUserBtn').addEventListener('click', () => {
            $('rememberedUser').hidden = true;
            $('emailField').hidden = false;
            $('usuario').value = '';
            $('usuario').focus();
        });

        $('btnEye').addEventListener('click', () => {
            const show = $('clave').type === 'password';
            $('clave').type = show ? 'text' : 'password';
            $('btnEye').innerHTML = `<i data-lucide="${show ? 'eye-off' : 'eye'}"></i>`;
            lucide.createIcons();
        });

        $('clave').addEventListener('keyup', e => {
            $('capsHint').classList.toggle('show', e.getModifierState && e.getModifierState('CapsLock'));
        });

        document.querySelectorAll('#usuario, #clave').forEach(i => i.addEventListener('input', () => {
            $('login-error').classList.remove('show');
            document.querySelectorAll('.is-invalid').forEach(x => x.classList.remove('is-invalid'));
        }));

        $('form_login').addEventListener('submit', e => {
            e.preventDefault();
            $('btnLogin').classList.add('loading');
            setTimeout(() => {
                $('btnLogin').classList.remove('loading');
                $('login-error').classList.add('show');
                document.querySelectorAll('#usuario, #clave').forEach(i => i.classList.add('is-invalid'));
            }, 1000);
        });

        document.querySelectorAll('.js-year').forEach(el => el.textContent = new Date().getFullYear());
        lucide.createIcons();
    </script>
</body>

</html>
