<!DOCTYPE html>
<!--
    Propuesta B :: Elige una cuenta
    Evolución del login actual (misma tarjeta, mismos tokens, mismo halo) para
    equipos COMPARTIDOS del almacén: recuerda hasta 5 cuentas en el navegador y
    entra en dos pasos (cuenta -> contraseña), al estilo de Google.

    Cambio en acceso/src/js/index.js: REMEMBER_KEY pasa de un objeto a un arreglo
    (inventory:login:remember:v2), sin guardar nunca la contraseña.

    Contrato con index.js (no renombrar):
      #form_login, #usuario, #clave, #btnEye, #rememberMe, #login-error,
      #login-error-text, #emailField, #rememberedUser, #forgetUserBtn
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../../src/img/logos/coffee_icon.png" type="image/x-icon">
    <title>Coffee Inventory - Propuesta B</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --acc-bg:          #F5F5F5;
            --acc-card:        #FFFFFF;
            --acc-ink:         #0D0D0D;
            --acc-ink-soft:    #525252;
            --acc-ink-mute:    #A3A3A3;
            --acc-line:        #E5E5E5;
            --acc-line-strong: #D4D4D4;
            --acc-hover:       #FAFAFA;
            --acc-primary:     #171717;
            --acc-primary-h:   #262626;
            --acc-accent:      #C05A40;
            --acc-accent-tint: rgba(192, 90, 64, 0.12);
            --acc-danger:      #9D3434;
            --acc-danger-bg:   #FDF2F2;
            --acc-danger-line: #F0D3D3;
            --acc-warn:        #8A5A00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--acc-bg);
            color: var(--acc-ink);
            -webkit-font-smoothing: antialiased;
        }

        body::after {
            content: '';
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 240px;
            z-index: 0;
            pointer-events: none;
            background: linear-gradient(100deg, #f6d4b0 0%, #f4c2a1 32%, #e8b4b8 64%, #d9c2f0 100%);
            filter: blur(55px);
            opacity: .6;
            -webkit-mask-image: linear-gradient(to top, #000 40%, transparent 100%);
            mask-image: linear-gradient(to top, #000 40%, transparent 100%);
        }

        .login-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            position: relative;
            background: var(--acc-card);
            border: 1px solid var(--acc-line);
            border-radius: 18px;
            padding: 36px 28px 26px;
            box-shadow: 0 18px 44px -20px rgba(28, 25, 23, 0.25);
        }

        .back-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            display: none;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--acc-ink-soft);
            cursor: pointer;
        }

        .back-btn.show { display: flex; }
        .back-btn:hover { background: var(--acc-bg); color: var(--acc-ink); }
        .back-btn svg { width: 19px; height: 19px; }

        .login-brand {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
        }

        /* Con cuenta elegida el avatar ya identifica: el logo sobra. */
        .login-card.has-account .login-brand { display: none; }

        .login-mark {
            display: block;
            width: 52px;
            height: 40px;
            background: url('../../../src/img/logos/coffeesoft-logo-64.svg') center / contain no-repeat;
        }

        .login-title {
            text-align: center;
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .login-sub {
            text-align: center;
            font-size: 13.5px;
            color: var(--acc-ink-soft);
            margin-top: 6px;
        }

        /* -- Pasos: solo uno visible a la vez -- */
        .step { display: none; margin-top: 24px; }
        .step.on { display: block; animation: enter .22s ease-out; }

        @keyframes enter {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: none; }
        }

        /* -- Paso 1 :: cuentas recordadas -- */
        .accounts {
            border: 1px solid var(--acc-line);
            border-radius: 14px;
            overflow: hidden;
        }

        .account {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px 14px;
            border: none;
            background: var(--acc-card);
            font-family: inherit;
            text-align: left;
            color: inherit;
            cursor: pointer;
            transition: background .12s;
        }

        .account + .account { border-top: 1px solid var(--acc-line); }
        .account:hover { background: var(--acc-hover); }
        .account:focus-visible { outline: 2px solid var(--acc-accent); outline-offset: -2px; }

        .avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #9CA3AF;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 600;
        }

        .avatar svg { width: 19px; height: 19px; }
        .avatar.lg { width: 64px; height: 64px; font-size: 22px; }

        .account-info { flex: 1; min-width: 0; }

        .account-name,
        .account-mail {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .account-name { font-size: 14px; font-weight: 600; }
        .account-mail { font-size: 12.5px; color: var(--acc-ink-soft); margin-top: 1px; }

        .account-meta {
            flex-shrink: 0;
            font-size: 11.5px;
            color: var(--acc-ink-mute);
        }

        .account-chev { width: 17px; height: 17px; color: var(--acc-ink-mute); flex-shrink: 0; }

        /* Quitar una cuenta: aparece al pasar el mouse; en pantallas táctiles siempre visible. */
        .account-x {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            border-radius: 8px;
            color: var(--acc-ink-mute);
            opacity: 0;
            transition: opacity .12s, background .12s;
        }

        .account:hover .account-x { opacity: 1; }
        .account-x:hover { background: var(--acc-line); color: var(--acc-ink); }
        .account-x svg { width: 15px; height: 15px; }

        @media (hover: none) {
            .account-x { opacity: 1; }
        }

        .account.other .avatar {
            background: var(--acc-bg);
            color: var(--acc-ink-soft);
            border: 1px dashed var(--acc-line-strong);
        }

        .accounts-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 14px;
            font-size: 12px;
            color: var(--acc-ink-mute);
        }

        .accounts-note svg { width: 13px; height: 13px; }

        /* -- Paso 2 :: cuenta elegida -- */
        .remembered {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .remembered[hidden] { display: none; }

        .remembered-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            max-width: 100%;
            padding: 5px 6px 5px 12px;
            border: 1px solid var(--acc-line-strong);
            border-radius: 999px;
            font-size: 13px;
            color: var(--acc-ink-soft);
        }

        .remembered-chip span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .remembered-x {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            border: none;
            border-radius: 50%;
            background: var(--acc-bg);
            color: var(--acc-ink-soft);
            cursor: pointer;
        }

        .remembered-x:hover { background: var(--acc-line); color: var(--acc-ink); }
        .remembered-x svg { width: 13px; height: 13px; }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .field { position: relative; }
        .field[hidden] { display: none; }

        .field-input {
            width: 100%;
            height: 54px;
            padding: 22px 14px 7px;
            font-size: 14.5px;
            font-family: inherit;
            color: var(--acc-ink);
            background: var(--acc-card);
            border: 1px solid var(--acc-line-strong);
            border-radius: 10px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        .field-input.has-eye { padding-right: 46px; }

        .field-input:focus {
            border-color: var(--acc-accent);
            box-shadow: 0 0 0 3px var(--acc-accent-tint);
        }

        .field-label {
            position: absolute;
            left: 15px;
            top: 9px;
            font-size: 11.5px;
            font-weight: 500;
            color: var(--acc-ink-mute);
            pointer-events: none;
            transition: top .15s, font-size .15s, color .15s;
        }

        .field-input:placeholder-shown + .field-label { top: 17px; font-size: 14.5px; }
        .field-input:focus + .field-label { top: 9px; font-size: 11.5px; color: var(--acc-accent); }
        .field-input.is-invalid { border-color: var(--acc-danger); }

        .eye-btn {
            position: absolute;
            right: 8px;
            top: 27px;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--acc-ink-mute);
            cursor: pointer;
        }

        .eye-btn:hover { color: var(--acc-ink); background: var(--acc-bg); }
        .eye-btn svg { width: 18px; height: 18px; }

        .caps {
            display: none;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--acc-warn);
        }

        .caps.show { display: flex; }
        .caps svg { width: 14px; height: 14px; }

        .remember-check {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            color: var(--acc-ink-soft);
            cursor: pointer;
            user-select: none;
            margin-top: 2px;
        }

        .remember-check input {
            width: 15px;
            height: 15px;
            accent-color: var(--acc-primary);
            cursor: pointer;
        }

        .login-error {
            display: none;
            align-items: center;
            gap: 9px;
            padding: 11px 13px;
            border: 1px solid var(--acc-danger-line);
            border-radius: 10px;
            background: var(--acc-danger-bg);
            color: var(--acc-danger);
            font-size: 12.5px;
        }

        .login-error.show { display: flex; }
        .login-error svg { width: 16px; height: 16px; flex-shrink: 0; }

        .btn-continue {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 50px;
            margin-top: 6px;
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 600;
            color: #FFFFFF;
            background: var(--acc-primary);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: background .15s, transform .1s;
        }

        .btn-continue:hover { background: var(--acc-primary-h); }
        .btn-continue:active { transform: scale(.99); }
        .btn-continue svg { width: 17px; height: 17px; }
        .btn-continue .spin { display: none; }
        .btn-continue.loading { pointer-events: none; opacity: .85; }
        .btn-continue.loading .spin { display: block; animation: spin .8s linear infinite; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            font-weight: 500;
            color: var(--acc-accent);
            text-decoration: none;
        }

        .login-link:hover { text-decoration: underline; }

        .login-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 11.5px;
            color: var(--acc-ink-mute);
        }

        .cs-brand { font-weight: 700; }
        .cs-coffee { color: var(--acc-ink-soft); }
        .cs-soft { color: var(--acc-accent); }

        @media (max-width: 420px) {
            .login-card { padding: 32px 18px 22px; }
            .login-title { font-size: 23px; }
            .account-meta { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>

<body>

    <main class="login-shell">

        <div class="login-card">

            <button type="button" class="back-btn" id="btnBack" aria-label="Volver a las cuentas"><i data-lucide="chevron-left"></i></button>

            <div class="login-brand">
                <span class="login-mark" aria-hidden="true"></span>
            </div>

            <h1 class="login-title" id="stepTitle">Elige una cuenta</h1>
            <p class="login-sub" id="stepSub">para continuar a Coffee Inventory</p>

            <!-- Paso 1 :: cuentas recordadas en este equipo -->
            <section class="step on" id="stepAccounts">
                <div class="accounts" id="accountList"></div>

                <p class="accounts-note"><i data-lucide="lock"></i>Solo se recuerdan correo y nombre, nunca la contraseña.</p>
            </section>

            <!-- Paso 2 :: contraseña de la cuenta elegida, o correo + contraseña si es otra -->
            <section class="step" id="stepPassword">

                <div id="rememberedUser" class="remembered" hidden>
                    <span id="rememberedAvatar" class="avatar lg"></span>
                    <span class="remembered-chip">
                        <span id="rememberedEmail"></span>
                        <button type="button" id="forgetUserBtn" class="remembered-x" aria-label="Usar otra cuenta" title="Usar otra cuenta">
                            <i data-lucide="x"></i>
                        </button>
                    </span>
                </div>

                <form id="form_login" novalidate class="login-form">

                    <div id="login-error" class="login-error" role="alert">
                        <i data-lucide="circle-alert"></i>
                        <span id="login-error-text">Usuario y/o clave incorrectos.</span>
                    </div>

                    <div class="field" id="emailField">
                        <input type="email" class="field-input" name="usuario" id="usuario" placeholder=" " required autocomplete="username">
                        <label class="field-label" for="usuario">Correo electrónico</label>
                    </div>

                    <div class="field">
                        <input type="password" class="field-input has-eye" name="clave" id="clave" placeholder=" " required autocomplete="current-password">
                        <label class="field-label" for="clave">Contraseña</label>
                        <button type="button" class="eye-btn" id="btnEye" aria-label="Mostrar contraseña"><i data-lucide="eye"></i></button>
                        <span class="caps" id="capsHint"><i data-lucide="triangle-alert"></i>Bloq Mayús está activado</span>
                    </div>

                    <label class="remember-check">
                        <input type="checkbox" id="rememberMe" checked>
                        <span>Recordar mi cuenta en este equipo</span>
                    </label>

                    <button type="submit" class="btn-continue" id="btnLogin">
                        <span>Continuar</span>
                        <i data-lucide="loader-circle" class="spin"></i>
                    </button>
                </form>

                <a class="login-link" href="../../../recuperar.php">¿Olvidaste tu contraseña?</a>
            </section>
        </div>

        <p class="login-footer">Powered by <span class="cs-brand"><span class="cs-coffee">Coffee</span><span class="cs-soft">Soft</span></span> &copy; <span class="js-year">2026</span></p>
    </main>

    <script src="../../../src/plugin/lucide/lucide.min.js"></script>
    <script>
        // Demo de la maqueta: en producción las cuentas salen de localStorage
        // (inventory:login:remember:v2) y el envío lo hace acceso/src/js/index.js.
        const ACCOUNTS = [
            { name: 'María López',     email: 'maria@cafecentral.mx',  color: '#C05A40', last: 'Hoy, 08:12' },
            { name: 'Luis Hernández',  email: 'almacen@cafecentral.mx', color: '#2563EB', last: 'Ayer' },
            { name: 'Ana Gómez',       email: 'ana.gomez@cafecentral.mx', color: '#7C3AED', last: 'Lun 5 oct' }
        ];

        const $ = id => document.getElementById(id);

        function initials(name) {
            return name.split(' ').slice(0, 2).map(p => p[0]).join('').toUpperCase();
        }

        function renderAccounts() {
            const rows = ACCOUNTS.map((a, i) => `
                <button type="button" class="account" data-i="${i}">
                    <span class="avatar" style="background:${a.color}">${initials(a.name)}</span>
                    <span class="account-info">
                        <span class="account-name">${a.name}</span>
                        <span class="account-mail">${a.email}</span>
                    </span>
                    <span class="account-meta">${a.last}</span>
                    <span class="account-x" data-remove="${i}" title="Quitar de este equipo"><i data-lucide="x"></i></span>
                </button>`).join('');

            $('accountList').innerHTML = rows + `
                <button type="button" class="account other" data-i="new">
                    <span class="avatar"><i data-lucide="user-plus"></i></span>
                    <span class="account-info">
                        <span class="account-name">Usar otra cuenta</span>
                        <span class="account-mail">Entra con tu correo y contraseña</span>
                    </span>
                    <i data-lucide="chevron-right" class="account-chev"></i>
                </button>`;

            lucide.createIcons();
        }

        function showStep(id, title, sub) {
            document.querySelectorAll('.step').forEach(s => s.classList.toggle('on', s.id === id));
            $('stepTitle').textContent = title;
            $('stepSub').textContent = sub;
            $('btnBack').classList.toggle('show', id !== 'stepAccounts' && ACCOUNTS.length > 0);
            document.querySelector('.login-card').classList.toggle('has-account', id === 'stepPassword' && !$('rememberedUser').hidden);
        }

        function pickAccount(i) {
            $('login-error').classList.remove('show');

            if (i === 'new') {
                $('usuario').value = '';
                $('rememberedUser').hidden = true;
                $('emailField').hidden = false;
                showStep('stepPassword', 'Inicia sesión', 'con tu cuenta de Coffee Inventory');
                $('usuario').focus();
                return;
            }

            const a = ACCOUNTS[i];
            $('usuario').value = a.email;
            $('emailField').hidden = true;
            $('rememberedAvatar').style.background = a.color;
            $('rememberedAvatar').textContent = initials(a.name);
            $('rememberedEmail').textContent = a.email;
            $('rememberedUser').hidden = false;
            showStep('stepPassword', `Hola, ${a.name.split(' ')[0]}`, 'Escribe tu contraseña para continuar');
            $('clave').focus();
        }

        $('accountList').addEventListener('click', e => {
            const remove = e.target.closest('[data-remove]');
            if (remove) {
                e.stopPropagation();
                ACCOUNTS.splice(+remove.dataset.remove, 1);
                renderAccounts();
                return;
            }
            const row = e.target.closest('.account');
            if (row) pickAccount(row.dataset.i === 'new' ? 'new' : +row.dataset.i);
        });

        $('btnBack').addEventListener('click', () => showStep('stepAccounts', 'Elige una cuenta', 'para continuar a Coffee Inventory'));
        $('forgetUserBtn').addEventListener('click', () => pickAccount('new'));

        $('btnEye').addEventListener('click', () => {
            const show = $('clave').type === 'password';
            $('clave').type = show ? 'text' : 'password';
            $('btnEye').innerHTML = `<i data-lucide="${show ? 'eye-off' : 'eye'}"></i>`;
            lucide.createIcons();
        });

        $('clave').addEventListener('keyup', e => {
            $('capsHint').classList.toggle('show', e.getModifierState && e.getModifierState('CapsLock'));
        });

        $('form_login').addEventListener('submit', e => {
            e.preventDefault();
            $('btnLogin').classList.add('loading');
            setTimeout(() => {
                $('btnLogin').classList.remove('loading');
                $('login-error').classList.add('show');
            }, 1200);
        });

        document.querySelectorAll('.js-year').forEach(el => el.textContent = new Date().getFullYear());

        renderAccounts();
        if (!ACCOUNTS.length) pickAccount('new');
    </script>
</body>

</html>
