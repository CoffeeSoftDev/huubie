<!DOCTYPE html>
<!--
    Propuesta G :: estilo ChatGPT
    Página blanca sin tarjeta, todo al centro, campos y botón tipo píldora.
    Entrada en dos pasos: primero el correo, luego la contraseña con el correo
    fijo arriba y un "Editar". El usuario recordado entra directo al paso 2.
    Respeta el modo oscuro del sistema (prefers-color-scheme).

    Cambio en acceso/src/js/index.js: el primer "Continuar" sin usuario recordado
    no envía, solo pasa al paso de la contraseña (data-step en #form_login).

    Contrato con index.js (no renombrar):
      #form_login, #usuario, #clave, #btnEye, #rememberMe, #login-error,
      #login-error-text, #emailField, #rememberedUser, #rememberedAvatar,
      #rememberedName, #rememberedEmail, #forgetUserBtn
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../../src/img/logos/coffee_icon.png" type="image/x-icon">
    <title>Coffee Inventory - Propuesta G</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:          #FFFFFF;
            --ink:         #0D0D0D;
            --ink-soft:    #5D5D5D;
            --ink-mute:    #8F8F8F;
            --line:        #E3E3E3;
            --line-strong: #CDCDCD;
            --field:       #FFFFFF;
            --field-ro:    #F7F7F7;
            --primary:     #0D0D0D;
            --primary-h:   #2B2B2B;
            --on-primary:  #FFFFFF;
            --focus:       #0D0D0D;
            --danger:      #D00E17;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg:          #212121;
                --ink:         #ECECEC;
                --ink-soft:    #B4B4B4;
                --ink-mute:    #8E8E8E;
                --line:        #3A3A3A;
                --line-strong: #4E4E4E;
                --field:       #212121;
                --field-ro:    #2A2A2A;
                --primary:     #FFFFFF;
                --primary-h:   #E5E5E5;
                --on-primary:  #0D0D0D;
                --focus:       #ECECEC;
                --danger:      #F47B7B;
            }
        }

        :root[data-theme="dark"] {
            --bg:          #212121;
            --ink:         #ECECEC;
            --ink-soft:    #B4B4B4;
            --ink-mute:    #8E8E8E;
            --line:        #3A3A3A;
            --line-strong: #4E4E4E;
            --field:       #212121;
            --field-ro:    #2A2A2A;
            --primary:     #FFFFFF;
            --primary-h:   #E5E5E5;
            --on-primary:  #0D0D0D;
            --focus:       #ECECEC;
            --danger:      #F47B7B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        .logo {
            display: block;
            background: currentColor;
            -webkit-mask: url('../../../src/img/logos/coffeesoft-logo-64.svg') center / contain no-repeat;
            mask: url('../../../src/img/logos/coffeesoft-logo-64.svg') center / contain no-repeat;
        }

        .top {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 18px 22px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .top .logo { width: 24px; height: 18px; }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px 48px;
        }

        .box {
            width: 100%;
            max-width: 360px;
        }

        .title {
            text-align: center;
            font-size: 30px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin-top: 10px;
            text-align: center;
            font-size: 15px;
            line-height: 1.45;
            color: var(--ink-soft);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 28px;
        }

        /* -- Pasos: el paso 1 solo muestra el correo -- */
        .login-form[data-step="email"] .only-password { display: none; }

        .field { position: relative; }
        .field[hidden] { display: none; }

        .field-input {
            width: 100%;
            height: 52px;
            padding: 0 20px;
            font-family: inherit;
            font-size: 16px;
            color: var(--ink);
            background: var(--field);
            border: 1px solid var(--line-strong);
            border-radius: 999px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        .field-input::placeholder { color: var(--ink-mute); }
        .field-input.has-eye { padding-right: 54px; }

        .field-input:focus {
            border-color: var(--focus);
            box-shadow: 0 0 0 1px var(--focus);
        }

        .field-input.is-invalid,
        .field-input.is-invalid:focus {
            border-color: var(--danger);
            box-shadow: 0 0 0 1px var(--danger);
        }

        .eye-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--ink-mute);
            cursor: pointer;
        }

        .eye-btn:hover { color: var(--ink); background: var(--field-ro); }
        .eye-btn svg { width: 18px; height: 18px; }

        /* -- Correo fijo del paso 2 (usuario recordado o recién escrito) -- */
        .remembered {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 52px;
            padding: 0 8px 0 10px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--field-ro);
        }

        .remembered[hidden] { display: none; }

        .remembered-avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #8F8F8F;
            color: #FFFFFF;
        }

        .remembered-avatar svg { width: 16px; height: 16px; }
        .remembered-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .remembered-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            line-height: 1.25;
        }

        .remembered-name,
        .remembered-email {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .remembered-name { font-size: 14px; font-weight: 600; }
        .remembered-name:empty { display: none; }
        .remembered-email { font-size: 13.5px; color: var(--ink-soft); }
        .remembered-name:empty + .remembered-email { font-size: 15px; color: var(--ink); }

        .edit-btn {
            flex-shrink: 0;
            height: 36px;
            padding: 0 14px;
            border: none;
            border-radius: 999px;
            background: transparent;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: var(--ink);
            cursor: pointer;
        }

        .edit-btn:hover { background: var(--line); }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 6px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            color: var(--ink-soft);
            cursor: pointer;
            user-select: none;
        }

        .remember input { width: 15px; height: 15px; accent-color: var(--primary); cursor: pointer; }

        .row a,
        .switch-link {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--ink);
            text-decoration: none;
        }

        .row a:hover { text-decoration: underline; }

        .caps {
            display: none;
            padding: 0 20px;
            font-size: 13px;
            color: var(--ink-soft);
        }

        .caps.show { display: block; }

        .login-error {
            display: none;
            align-items: center;
            gap: 7px;
            padding: 0 20px;
            font-size: 13.5px;
            color: var(--danger);
        }

        .login-error.show { display: flex; }
        .login-error svg { width: 16px; height: 16px; flex-shrink: 0; }

        .btn-continue {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 52px;
            margin-top: 4px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 500;
            color: var(--on-primary);
            background: var(--primary);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: background .15s;
        }

        .btn-continue:hover { background: var(--primary-h); }
        .btn-continue svg { width: 18px; height: 18px; }
        .btn-continue .spin { display: none; }
        .btn-continue.loading { pointer-events: none; opacity: .8; }
        .btn-continue.loading .spin { display: block; animation: spin .8s linear infinite; }
        .btn-continue.loading .label { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 22px 0 18px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: .04em;
            color: var(--ink-mute);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        .btn-outline {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 52px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            color: var(--ink);
            background: transparent;
            border: 1px solid var(--line-strong);
            border-radius: 999px;
            text-decoration: none;
            cursor: pointer;
            transition: background .15s;
        }

        .btn-outline:hover { background: var(--field-ro); }
        .btn-outline svg { width: 18px; height: 18px; }

        .foot {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 0 16px 22px;
            font-size: 12.5px;
            color: var(--ink-mute);
        }

        .foot a { color: var(--ink-mute); text-decoration: none; }
        .foot a:hover { color: var(--ink); text-decoration: underline; }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>

<body>

    <header class="top"><span class="logo"></span>Coffee Inventory</header>

    <main>
        <div class="box">

            <h1 class="title" id="title">Bienvenido de nuevo</h1>
            <p class="subtitle" id="subtitle">Ingresa tu correo para continuar.</p>

            <form id="form_login" novalidate class="login-form" data-step="email">

                <div id="rememberedUser" class="remembered" hidden>
                    <span id="rememberedAvatar" class="remembered-avatar"><i data-lucide="user"></i></span>
                    <span class="remembered-info">
                        <span id="rememberedName" class="remembered-name"></span>
                        <span id="rememberedEmail" class="remembered-email"></span>
                    </span>
                    <button type="button" id="forgetUserBtn" class="edit-btn">Editar</button>
                </div>

                <div class="field" id="emailField">
                    <input type="email" class="field-input" name="usuario" id="usuario" placeholder="Correo electrónico" required autocomplete="username" aria-label="Correo electrónico">
                </div>

                <div class="field only-password">
                    <input type="password" class="field-input has-eye" name="clave" id="clave" placeholder="Contraseña" required autocomplete="current-password" aria-label="Contraseña">
                    <button type="button" class="eye-btn" id="btnEye" aria-label="Mostrar contraseña"><i data-lucide="eye"></i></button>
                </div>

                <span class="caps" id="capsHint">Bloq Mayús está activado</span>

                <div id="login-error" class="login-error" role="alert">
                    <i data-lucide="circle-alert"></i>
                    <span id="login-error-text">Usuario y/o clave incorrectos.</span>
                </div>

                <div class="row only-password">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe" checked>
                        <span>Recordarme</span>
                    </label>
                    <a href="../../../recuperar.php">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-continue" id="btnLogin">
                    <span class="label">Continuar</span>
                    <i data-lucide="loader-circle" class="spin"></i>
                </button>
            </form>

            <div class="divider">O</div>

            <a class="btn-outline" href="../../../recuperar.php"><i data-lucide="key-round"></i>Recuperar acceso con un código</a>
        </div>
    </main>

    <footer class="foot">
        <a href="#">Ayuda</a><span>|</span><span>Powered by CoffeeSoft &copy; <span class="js-year">2026</span></span>
    </footer>

    <script src="../../../src/plugin/lucide/lucide.min.js"></script>
    <script>
        // Demo de la maqueta: el envío y el usuario recordado los maneja acceso/src/js/index.js.
        const $ = id => document.getElementById(id);
        const form = $('form_login');
        const params = new URLSearchParams(location.search);

        if (params.get('tema')) document.documentElement.setAttribute('data-theme', params.get('tema'));

        function toPassword(name, email) {
            $('usuario').value = email;
            $('emailField').hidden = true;
            $('rememberedName').textContent = name || '';
            $('rememberedEmail').textContent = email;
            $('rememberedUser').hidden = false;
            form.dataset.step = 'password';
            $('title').textContent = 'Ingresa tu contraseña';
            $('subtitle').textContent = 'Para continuar a Coffee Inventory.';
            $('clave').focus();
        }

        function toEmail() {
            $('rememberedUser').hidden = true;
            $('emailField').hidden = false;
            $('usuario').value = '';
            $('clave').value = '';
            $('login-error').classList.remove('show');
            document.querySelectorAll('.is-invalid').forEach(x => x.classList.remove('is-invalid'));
            form.dataset.step = 'email';
            $('title').textContent = 'Bienvenido de nuevo';
            $('subtitle').textContent = 'Ingresa tu correo para continuar.';
            $('usuario').focus();
        }

        // Usuario recordado de ejemplo (?recordado=1): entra directo al paso 2.
        if (params.get('recordado') === '1') toPassword('María López', 'maria@cafecentral.mx');

        $('forgetUserBtn').addEventListener('click', toEmail);

        $('btnEye').addEventListener('click', () => {
            const show = $('clave').type === 'password';
            $('clave').type = show ? 'text' : 'password';
            $('btnEye').innerHTML = `<i data-lucide="${show ? 'eye-off' : 'eye'}"></i>`;
            lucide.createIcons();
        });

        $('clave').addEventListener('keyup', e => {
            $('capsHint').classList.toggle('show', e.getModifierState && e.getModifierState('CapsLock'));
        });

        form.addEventListener('submit', e => {
            e.preventDefault();

            if (form.dataset.step === 'email') {
                const email = $('usuario').value.trim();
                if (!/^\S+@\S+\.\S+$/.test(email)) {
                    $('login-error-text').textContent = 'Escribe un correo válido.';
                    $('login-error').classList.add('show');
                    $('usuario').classList.add('is-invalid');
                    return;
                }
                $('login-error').classList.remove('show');
                $('usuario').classList.remove('is-invalid');
                toPassword('', email);
                return;
            }

            $('btnLogin').classList.add('loading');
            setTimeout(() => {
                $('btnLogin').classList.remove('loading');
                $('login-error-text').textContent = 'Usuario y/o clave incorrectos.';
                $('login-error').classList.add('show');
                $('clave').classList.add('is-invalid');
            }, 1000);
        });

        document.querySelectorAll('.js-year').forEach(el => el.textContent = new Date().getFullYear());
        lucide.createIcons();
    </script>
</body>

</html>
